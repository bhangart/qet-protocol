# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qet-protocol"
version = "0.0.1"
description = "Feed generator, signing and verification for shared QElectroTech element libraries"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["babel>=2.12"]

[project.scripts]
qet-feedgen = "qet_protocol.feedgen:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is how pytest tests are written
